name: 🧪 Auto Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    # 1. Checkout code
    - uses: actions/checkout@v4
    
    # 2. Setup Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    # 3. Install dependencies
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy
    
    # 4. Code formatting check (Black)
    - name: 🎨 Check code formatting
      run: black --check . --exclude=".venv,venv"
    
    # 5. Linting (Flake8)
    - name: 🔍 Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # 6. Type checking (MyPy)
    - name: 📋 Type checking with mypy
      run: mypy utils/ --ignore-missing-imports || true
    
    # 7. Unit tests (Pytest)
    - name: ✅ Run unit tests with pytest
      run: pytest tests/ -v --cov=utils --cov-report=xml --cov-report=html
    
    # 8. Upload coverage to Codecov
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    # 9. Streamlit app validation
    - name: 🚀 Validate Streamlit app
      run: |
        streamlit run app.py --logger.level=debug --client.showErrorDetails=true &
        sleep 5
        kill %1 || true

  # Security check
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit security check
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.json

  # Dependency check
  dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for outdated dependencies
      run: |
        pip install pip-audit
        pip-audit --ignore-vuln CVE-2024-XXXXX || true
