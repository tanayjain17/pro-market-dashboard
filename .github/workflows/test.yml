name: 🧪 Auto Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy types-requests
    
    - name: 🎨 Check code formatting
      run: black --check . --exclude=".venv|venv|__pycache__" || true
    
    - name: 🔍 Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: 📋 Type checking with mypy
      run: |
        echo "🔍 Running MyPy type checker (warnings only)..."
        mypy utils/ pages/ --ignore-missing-imports --install-types --non-interactive --follow-imports=skip || true
      continue-on-error: true
    
    - name: ✅ Run unit tests with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        echo "PYTHONPATH is now: $PYTHONPATH"
        pytest tests/ -v --cov=utils --cov=pages --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    # SINGLE Streamlit validation step with debugging
    - name: 🚀 Validate Streamlit app
      run: |
        echo "=== CHECKING PYTHON SYNTAX ==="
        python -m py_compile app.py || exit 1
        python -m py_compile utils/*.py || exit 1
        
        echo "=== TESTING IMPORTS ==="
        python -c "
import sys
print(f'Python version: {sys.version}')
try:
    import streamlit
    print(f'✅ streamlit: {streamlit.__version__}')
except Exception as e:
    print(f'❌ streamlit: {e}')
    sys.exit(1)

try:
    import pandas
    print(f'✅ pandas: {pandas.__version__}')
except Exception as e:
    print(f'❌ pandas: {e}')
    sys.exit(1)

try:
    from utils.ml_engine import analyze_indian_stock
    print('✅ utils.ml_engine import OK')
except Exception as e:
    print(f'❌ utils.ml_engine import failed: {e}')
    sys.exit(1)

try:
    from utils.data_engine import robust_yf_download
    print('✅ utils.data_engine import OK')
except Exception as e:
    print(f'❌ utils.data_engine import failed: {e}')
    sys.exit(1)

print('🎉 All imports successful!')
"
        
        echo "=== STARTING STREAMLIT APP ==="
        streamlit run app.py --server.headless=true --server.port=8501 --logger.level=debug > streamlit.log 2>&1 &
        STREAMLIT_PID=$!
        echo "Streamlit PID: $STREAMLIT_PID"
        
        # Wait for app to initialize
        sleep 15
        
        # Check if still running
        if ps -p $STREAMLIT_PID > /dev/null; then
          echo "✅ Streamlit app started successfully"
          echo "--- Last 20 lines of Streamlit log ---"
          tail -20 streamlit.log
          kill $STREAMLIT_PID
        else
          echo "❌ Streamlit app failed to start"
          echo "--- Full Streamlit log ---"
          cat streamlit.log
          exit 1
        fi

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install bandit
      run: pip install bandit
    - name: Run Bandit security check
      run: |
        bandit -r . -f json -o bandit-report.json \
          --exclude ./tests,./venv,./.venv,./__pycache__ \
          --severity-level medium \
          --confidence-level medium || true
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check for security vulnerabilities
      run: |
        pip install pip-audit safety
        echo "🔒 Running pip-audit..."
        pip-audit --requirement requirements.txt || true
        echo "🔒 Running safety check..."
        safety check -r requirements.txt --full-report || true
