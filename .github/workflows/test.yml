name: 🧪 Auto Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy types-requests
    
    - name: 🎨 Check code formatting
      run: black --check . --exclude=".venv|venv|__pycache__" || true
    
    - name: 🔍 Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: 📋 Type checking with mypy
      run: |
        echo "🔍 Running MyPy type checker (warnings only)..."
        mypy utils/ pages/ --ignore-missing-imports --install-types --non-interactive --follow-imports=skip || true
      continue-on-error: true
    
    # CRITICAL FIX: Set PYTHONPATH and run tests
    - name: ✅ Run unit tests with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        echo "PYTHONPATH is now: $PYTHONPATH"
        pytest tests/ -v --cov=utils --cov=pages --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: 🚀 Validate Streamlit app
      run: |
        streamlit run app.py --logger.level=debug --client.showErrorDetails=true &
        STREAMLIT_PID=$!
        sleep 10
        if ps -p $STREAMLIT_PID > /dev/null; then
          echo "✅ Streamlit app started successfully"
          kill $STREAMLIT_PID
        else
          echo "❌ Streamlit app failed to start"
          exit 1
        fi

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install bandit
      run: pip install bandit
    - name: Run Bandit security check
      run: |
        bandit -r . -f json -o bandit-report.json \
          --exclude ./tests,./venv,./.venv,./__pycache__ \
          --severity-level medium \
          --confidence-level medium || true
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check for security vulnerabilities
      run: |
        pip install pip-audit safety
        echo "🔒 Running pip-audit..."
        pip-audit --requirement requirements.txt || true
        echo "🔒 Running safety check..."
        safety check -r requirements.txt --full-report || true
